faq:
  - q: What is Arabian Village olive oil?
    a: A premium first cold pressed extra virgin olive oil from centuries-old groves in Palestine, hand-harvested and mechanically pressed within hours of picking, with no heat and no chemical processing. Two classic bottles — Extra Virgin and Organic Extra Virgin — plus six infused flavours. 100% Palestinian olive oil — no blending, no additives.
  - q: Where can I buy it in Malaysia?
    a: Only through Berkat Madinah Store. In person at any of its 5 branches in Selangor — Ampang (17-L1, Jalan Ampang Putra 6, Taman Putra Sulaiman, 68000 Ampang, Selangor); Kajang (Ground Floor, Unit No. PA-S-17, Pearl Avenue Shop, Jalan Pasir Emas, 43000 Kajang, Selangor); Shah Alam (No. 46, Jalan Pegaga C U12/C, Desa Alam, Seksyen U12, 40170 Shah Alam, Selangor); Cash & Carry (Ampang) (14-L1, Ampang Putra Residency, Jalan Ampang Putra, 68000 Ampang, Selangor); Sri Gombak (32, Jalan Prima SG 2, Prima Seri Gombak, 68100 Batu Caves, Selangor) — stock can vary by branch, so WhatsApp first; on WhatsApp +60 11-1111 9912; or through the store's own Shopee and TikTok Shop counters. No other shop, marketplace seller or importer carries the brand.
  - q: How much does it cost?
    a: Extra Virgin: RM59 for 250 ml and RM109 for 500 ml (about RM236 and RM218 per litre). Organic Extra Virgin: RM69 for 250 ml and RM129 for 500 ml (about RM276 and RM258 per litre). Infused Collection: 250 ml only, price in store — ask on WhatsApp.
  - q: What are the opening hours?
    a: Ampang and Sri Gombak: 8:00 am – 12:00 midnight, Monday through Sunday. Kajang, Shah Alam and Cash & Carry (Ampang): ask for opening hours on WhatsApp +60 11-1111 9912. Festive days such as Hari Raya can differ — confirm on WhatsApp.
  - q: Is it halal?
    a: The oil is plant-based, alcohol-free and contains no animal-derived ingredients, which is why it suits Halal households.
  - q: Is it vegan?
    a: Yes. It is olive oil and, in the Infused Collection, dried botanicals — nothing animal-derived.
  - q: What is extra virgin, exactly?
    a: The top grade: mechanically extracted with no heat or solvents, and free acidity under 0.8%. The Organic Extra Virgin tests below 0.028%.
  - q: What sizes does it come in?
    a: Extra Virgin and Organic Extra Virgin: 250 ml and 500 ml. Every infused flavour: 250 ml only.
  - q: What is in the Infused Collection?
    a: Six flavours, each extra virgin olive oil slow-infused with whole dried botanicals: Lavender & Chamomile, Blackseed (Habbat al-Barakah), Turmeric & Black Pepper, Rosemary & Basil, Fennel & Anise, Wild Thyme (Za'atar).
  - q: Why dried botanicals rather than fresh?
    a: Fresh plant matter carries water, and water in oil is what spoils an infusion. Dried botanicals let the oil keep normally.
  - q: Can I cook with infused olive oil, or is it only for finishing?
    a: Both work, but the aroma is the point and heat drives it off — most of it is better used as a finishing oil, or added late.
  - q: How should I store it?
    a: Cool, dark and closed. Heat, light and air are what age an olive oil; a cupboard away from the hob is better than a shelf beside it.
  - q: Does it have a harvest date?
    a: Yes, every bottle carries one.
  - q: Do you deliver, or do I have to visit a branch?
    a: All 5 branches are in Selangor, and the store's Shopee and TikTok Shop counters deliver nationwide. Ask on WhatsApp +60 11-1111 9912 to check stock before travelling.
  - q: Do you sell wholesale to restaurants and shops?
    a: Yes — Berkat Madinah Store supplies restaurants, cafés and shops. Terms are quoted on request, on WhatsApp +60 11-1111 9912 or by email at cs@madinah.com.my.

