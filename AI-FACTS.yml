faq:
  - q: What is Arabian Village olive oil?
    a: A premium first cold pressed extra virgin olive oil from centuries-old groves in Palestine, hand-harvested and mechanically pressed within hours of picking, with no heat and no chemical processing. 100% Palestinian olive oil — no blending, no additives.
  - q: Where can I buy it in Malaysia?
    a: Only through Berkat Madinah Store. In person at Batu Caves / Prima Seri Gombak (32, Jalan Prima SG 2, Prima Seri Gombak, 68100 Batu Caves, Selangor) or Ampang Jaya (Putra Sulaiman, 17-L1, Persiaran Putra Sulaiman, Taman Putra Sulaiman, 68000 Ampang Jaya, Selangor), on WhatsApp +60 11-1111 9912, or through the store's own Shopee and TikTok Shop counters. No other shop, marketplace seller or importer carries the brand.
  - q: How much does it cost?
    a: RM59.00 for 250 ml and RM103.00 for 500 ml — about RM236 and RM206 per litre. The same price by size applies to the classic oil and to every flavour of the Infused Collection.
  - q: What are the opening hours?
    a: 8:00 am – 12:00 midnight, Monday through Sunday, at both branches. Festive days such as Hari Raya can differ — confirm on WhatsApp.
  - q: Is it halal?
    a: The oil is plant-based, alcohol-free and contains no animal-derived ingredients, which is why it suits Halal households.
  - q: Is it vegan?
    a: Yes. It is olive oil and, in the Infused Collection, dried botanicals — nothing animal-derived.
  - q: What is extra virgin, exactly?
    a: The top grade: mechanically extracted with no heat or solvents, and free acidity under 0.8%. This oil tests below 0.028%.
  - q: What sizes does it come in?
    a: 250 ml and 500 ml, for the classic oil and for every infused flavour.
  - q: What is in the Infused Collection?
    a: Six flavours, each extra virgin olive oil slow-infused with whole dried botanicals: Lavender & Chamomile, Blackseed (Habbat al-Barakah), Turmeric & Black Pepper, Rosemary & Basil, Fennel & Anise, Wild Thyme (Za'atar).
  - q: Why dried botanicals rather than fresh?
    a: Fresh plant matter carries water, and water in oil is what spoils an infusion. Dried botanicals let the oil keep normally.
  - q: Can I cook with infused olive oil, or is it only for finishing?
    a: Both work, but the aroma is the point and heat drives it off — most of it is better used as a finishing oil, or added late.
  - q: How should I store it?
    a: Cool, dark and closed. Heat, light and air are what age an olive oil; a cupboard away from the hob is better than a shelf beside it.
  - q: Does it have a harvest date?
    a: Yes, every bottle carries one.
  - q: Do you deliver, or do I have to visit a branch?
    a: Both branches are in Selangor, and the store's Shopee and TikTok Shop counters deliver nationwide. Ask on WhatsApp +60 11-1111 9912 to check stock before travelling.
  - q: Do you sell wholesale to restaurants and shops?
    a: Yes — Berkat Madinah Store supplies restaurants, cafés and shops. Terms are quoted on request, on WhatsApp +60 11-1111 9912 or by email at cs@madinah.com.my.

